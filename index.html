<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08050a">
<title>指尖花 · Fingertip Bloom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='50%25' cy='50%25'%3E%3Cstop offset='0' stop-color='%23ffe6f0'/%3E%3Cstop offset='1' stop-color='%23e0559b'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' fill='%231a0a14'/%3E%3Cg fill='url(%23g)'%3E%3Cellipse cx='16' cy='9' rx='3.4' ry='7'/%3E%3Cellipse cx='16' cy='23' rx='3.4' ry='7'/%3E%3Cellipse cx='9' cy='16' rx='7' ry='3.4'/%3E%3Cellipse cx='23' cy='16' rx='7' ry='3.4'/%3E%3Cellipse cx='11' cy='11' rx='3' ry='6' transform='rotate(-45 11 11)'/%3E%3Cellipse cx='21' cy='21' rx='3' ry='6' transform='rotate(-45 21 21)'/%3E%3Cellipse cx='21' cy='11' rx='3' ry='6' transform='rotate(45 21 11)'/%3E%3Cellipse cx='11' cy='21' rx='3' ry='6' transform='rotate(45 11 21)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23ffd9a0'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#070409}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#f3e9ee;
    -webkit-font-smoothing:antialiased;
    cursor:crosshair;
  }
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}

  /* ---------- UI ---------- */
  .ui{position:fixed;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity 1.2s ease .3s}
  .ui.on{opacity:1}
  .ui .clickable{pointer-events:auto}

  /* 顶部 */
  .top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:26px 32px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand svg{width:22px;height:22px;flex:none;opacity:.92}
  .brand .t{font-size:19px;font-weight:600;letter-spacing:.06em;color:#fff5f8;line-height:1;white-space:nowrap}
  .brand .s{margin-left:10px;font-size:9.5px;letter-spacing:.34em;color:rgba(255,220,232,.34);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:500;transform:translateY(1px)}

  .badge{display:flex;align-items:center;gap:8px;padding:8px 15px 8px 13px;border-radius:999px;
    background:rgba(255,190,210,.045);border:1px solid rgba(255,175,200,.14);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    font-size:11.5px;letter-spacing:.1em;color:rgba(255,226,236,.8);white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:#ff5f8a;flex:none;
    box-shadow:0 0 9px 1px rgba(255,80,125,.85);transition:background .5s,box-shadow .5s}
  .dot.calm{background:#c47bd8;box-shadow:0 0 9px 1px rgba(180,110,220,.7)}

  /* 左侧手势卡 */
  .hud{position:absolute;left:32px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:12px;padding:11px 20px 11px 12px;border-radius:999px;
    background:rgba(255,235,242,.035);border:1px solid rgba(255,190,212,.11);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transform:translateY(-50%)}
  .hud.on{}
  .hud .ico{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,rgba(255,140,175,.22),rgba(120,40,90,.28));
    border:1px solid rgba(255,160,195,.18)}
  .hud .ico svg{width:15px;height:15px;stroke:#ffb0c8}
  .hud .m{font-size:12.5px;letter-spacing:.12em;color:#ffe4ee;line-height:1.45}
  .hud .c{font-size:9.5px;letter-spacing:.1em;color:rgba(255,205,222,.42);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* 摄像头预览 */
  /* 摄像头预览：默认不显示，只有真正拿到摄像头画面才亮出来
     （原来 .cam.on 在 CSS 里没有任何规则，降级后这里会留一个空黑框） */
  .cam{position:absolute;right:32px;bottom:78px;width:300px;height:200px;border-radius:14px;overflow:hidden;
    border:1px solid rgba(255,130,165,.26);background:#100a0f;display:none;
    box-shadow:0 14px 44px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.02) inset}
  .cam.on{display:block}
  .cam canvas{width:100%;height:100%;display:block}
  .cam .lb{position:absolute;top:9px;left:11px;display:flex;align-items:center;gap:6px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8.5px;letter-spacing:.2em;
    color:rgba(255,235,242,.82);text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .cam .lb i{width:4px;height:4px;border-radius:50%;background:#ff5f8a;display:block;
    box-shadow:0 0 7px 1px rgba(255,80,125,.9);animation:blink 1.9s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}

  /* 底部提示 */
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:34px}
  .hint .it{display:flex;align-items:center;gap:9px;opacity:.55;transition:opacity .4s}
  .hint .it.act{opacity:1}
  .hint .it svg{width:17px;height:17px;flex:none;stroke:rgba(255,215,230,.8);fill:none;stroke-width:1.3}
  .hint .it .k{font-size:11px;letter-spacing:.14em;color:#ffe0ea;line-height:1.3;white-space:nowrap}
  .hint .it .d{font-size:8.5px;letter-spacing:.14em;color:rgba(255,200,218,.36);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:2px}
  .hint .sep{width:1px;height:22px;background:linear-gradient(to bottom,transparent,rgba(255,180,205,.16),transparent)}

  /* 左下按钮 */
  .tools{position:absolute;left:32px;bottom:26px;display:flex;gap:9px}
  .btn{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;
    background:rgba(255,235,242,.035);border:1px solid rgba(255,190,212,.12);
    font-size:10px;letter-spacing:.12em;color:rgba(255,225,235,.62);cursor:pointer;
    transition:.25s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .btn:hover{background:rgba(255,150,185,.11);color:#ffe8f0;border-color:rgba(255,160,195,.28)}
  .btn.on{background:rgba(255,120,160,.14);color:#ffd9e6;border-color:rgba(255,140,175,.34)}
  .btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.4}

  /* 音乐按钮：播放中有呼吸光点 */
  #btnMusic .eq{display:inline-flex;align-items:flex-end;gap:1.5px;height:9px;margin-left:1px}
  #btnMusic .eq i{width:1.6px;border-radius:1px;background:currentColor;opacity:.55;
    animation:eqBar 1.1s ease-in-out infinite}
  #btnMusic .eq i:nth-child(1){height:4px;animation-delay:0s}
  #btnMusic .eq i:nth-child(2){height:8px;animation-delay:.18s}
  #btnMusic .eq i:nth-child(3){height:5px;animation-delay:.36s}
  @keyframes eqBar{0%,100%{transform:scaleY(.45);opacity:.4}50%{transform:scaleY(1);opacity:.95}}
  #btnMusic.playing{color:#ffd9e6;border-color:rgba(255,140,175,.34)}
  #btnMusic.playing svg{stroke:#ff9dbb}
  /* 自动播放被浏览器拦下时，轻轻闪一下提示可以点 */
  #btnMusic.needtap{animation:needTap 1.5s ease-in-out infinite}
  @keyframes needTap{
    0%,100%{border-color:rgba(255,190,212,.12);color:rgba(255,225,235,.62);box-shadow:none}
    50%{border-color:rgba(255,140,175,.62);color:#ffd9e6;box-shadow:0 0 14px rgba(255,120,160,.38)}
  }

  /* 换色按钮：前面的小色点就是当前花色 */
  #btnHue .swatch{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;
    background:#ff7fa4;box-shadow:0 0 7px rgba(255,127,164,.75);
    transition:background .7s ease, box-shadow .7s ease}

  /* ---------- 保存图片 · 预览层 ---------- */
  /* 手机上没有"下载"这回事：iOS 的 <a download> 对 data URL 直接无效，
     微信内置浏览器也禁下载。唯一全平台通用的做法是「长按图片 → 存到相册」，
     所以点保存后先把图铺出来给用户长按。 */
  .shot{position:fixed;inset:0;z-index:60;display:none;place-items:center;
    background:radial-gradient(ellipse 80% 70% at 50% 45%, rgba(26,12,22,.94), rgba(4,2,6,.97));
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    padding:20px;opacity:0;transition:opacity .3s ease}
  .shot.on{display:grid;opacity:1}
  .shot .box{display:flex;flex-direction:column;align-items:center;gap:14px;
    max-width:100%;max-height:100%}
  .shot img{max-width:100%;max-height:calc(100vh - 176px);max-height:calc(100dvh - 176px);
    width:auto;height:auto;display:block;border-radius:10px;
    box-shadow:0 26px 72px rgba(0,0,0,.72),0 0 0 1px rgba(255,150,185,.18);
    /* 关键：这几个属性绝不能写成 none，否则 iOS / 微信里长按呼不出系统菜单 */
    -webkit-touch-callout:default;
    -webkit-user-select:auto;user-select:auto;pointer-events:auto;
    animation:shotIn .5s cubic-bezier(.16,1,.3,1) both}
  @keyframes shotIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
  .shot .tip{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.1em;
    color:rgba(255,228,238,.9);text-align:center;line-height:1.6}
  .shot .tip b{color:#ffb8cf;font-weight:600}
  .shot .tip svg{width:15px;height:15px;flex:none;stroke:#ff9dbb;fill:none;stroke-width:1.4}
  .shot .acts{display:flex;gap:10px;margin-top:2px}
  .shot .sbtn{padding:9px 20px;border-radius:9px;font-size:11.5px;letter-spacing:.12em;
    color:rgba(255,228,238,.86);background:rgba(255,150,185,.11);
    border:1px solid rgba(255,160,195,.3);cursor:pointer;transition:.22s;
    -webkit-user-select:none;user-select:none}
  .shot .sbtn:active{transform:scale(.96)}
  .shot .sbtn.ghost{background:rgba(255,235,242,.04);border-color:rgba(255,190,212,.14);
    color:rgba(255,225,235,.58)}

  /* 载入 / 提示 */
  .veil{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:radial-gradient(ellipse 70% 60% at 50% 42%, #170b14 0%, #0a0610 55%, #050308 100%);
    transition:opacity 1s ease;text-align:center;padding:32px}
  .veil.gone{opacity:0;pointer-events:none}
  .veil .in{max-width:430px}
  .veil .rt{width:9px;height:9px;margin:0 auto 26px;border-radius:50%;position:relative;
    background:radial-gradient(circle,#fff2f6,#ff5f8a 70%);
    box-shadow:0 0 22px 5px rgba(255,90,140,.55);
    animation:pulse 1.9s cubic-bezier(.45,0,.55,1) infinite}
  .veil .rt::before,.veil .rt::after{content:'';position:absolute;inset:-11px;border-radius:50%;
    border:1px solid rgba(255,140,175,.42);animation:ripple 2.6s cubic-bezier(.2,.6,.4,1) infinite}
  .veil .rt::after{animation-delay:1.3s}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.35);opacity:1}}
  @keyframes ripple{0%{transform:scale(.45);opacity:.95}100%{transform:scale(3.4);opacity:0}}
  .veil h1{font-size:17px;font-weight:500;letter-spacing:.18em;color:rgba(255,232,240,.92);margin-bottom:16px}
  .veil p{font-size:12.5px;letter-spacing:.05em;line-height:1.95;color:rgba(255,208,224,.62);
    white-space:pre-line;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .veil .go{margin-top:22px;display:inline-flex;align-items:center;gap:8px;padding:10px 22px;border-radius:999px;
    background:rgba(255,120,160,.1);border:1px solid rgba(255,140,175,.3);color:#ffd6e3;
    font-size:11px;letter-spacing:.16em;cursor:pointer;transition:.25s}
  .veil .go:hover{background:rgba(255,120,160,.2);border-color:rgba(255,150,185,.5)}
  .veil .go.alt{background:transparent;border-color:rgba(255,140,175,.18);color:rgba(255,214,227,.55);
    margin-top:10px;font-size:10px}
  .veil .go.alt:hover{color:#ffd6e3;border-color:rgba(255,150,185,.4)}
  .veil .acts{display:flex;flex-direction:column;align-items:center}

  /* 电脑上打开时，顺手把「手机访问」地址亮出来（服务端 /__lanip 提供） */
  .lanhint{display:none;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,160,195,.1);
    font-size:11px;line-height:1.9;letter-spacing:.04em;color:rgba(255,205,222,.46);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .lanhint.on{display:block}
  .lanhint b{display:inline-block;margin-top:3px;color:#ffb8cf;font-weight:500;font-size:13px;
    letter-spacing:.02em;-webkit-user-select:all;user-select:all}

  /* ---------- 错落入场 ---------- */
  @keyframes riseIn{
    from{opacity:0;translate:0 14px;filter:blur(5px)}
    to{opacity:1;translate:0 0;filter:blur(0)}
  }
  .ui.on .brand{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .05s both}
  .ui.on .badge{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .18s both}
  .ui.on .hud{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .34s both}
  .ui.on .cam{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .46s both}
  .ui.on .hint{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .58s both}
  .ui.on .tools{animation:riseIn .9s cubic-bezier(.16,1,.3,1) .70s both}

  @media (prefers-reduced-motion:reduce){
    .ui.on .brand,.ui.on .badge,.ui.on .hud,.ui.on .cam,.ui.on .hint,.ui.on .tools{animation:none;opacity:1}
  }

  @media (max-width:820px){
    .top{padding:16px 16px}
    .brand .t{font-size:15px}.brand .s{font-size:7.5px;letter-spacing:.24em}
    .brand svg{width:17px;height:17px}
    .badge{font-size:9.5px;padding:6px 11px}
    .hud{left:16px;top:auto;bottom:118px;transform:none;padding:8px 14px 8px 9px;gap:9px}
    .hud.on{transform:none}
    .hud .ico{width:24px;height:24px}.hud .m{font-size:11px}.hud .c{font-size:8.5px}
    .cam{right:14px;top:58px;bottom:auto;width:118px;height:80px;border-radius:9px}
    .cam .lb{font-size:6.5px;top:5px;left:7px}
    .hint{gap:16px;bottom:70px}
    .hint .it .k{font-size:9.5px}.hint .it .d{display:none}
    .hint .it svg{width:13px;height:13px}
    .hint .sep{height:16px}
    .tools{left:16px;bottom:18px;gap:7px}
    .btn{font-size:9px;padding:7px 11px}
    /* 保存预览层：手机上留出更多图幅 */
    .shot{padding:14px}
    .shot img{max-height:calc(100vh - 156px);max-height:calc(100dvh - 156px)}
    .shot .tip{font-size:11px;letter-spacing:.06em}
    .shot .sbtn{padding:9px 16px;font-size:11px}
  }
  /* 横屏手机：高度只有 390 左右，底部放不下两行，hint 必须上移 */
  @media (max-height:560px) and (orientation:landscape){
    .cam{width:130px;height:88px;top:auto;bottom:70px}
    .hint{bottom:58px;gap:22px}
    .hint .it .d{display:none}
    .hint .it .k{font-size:9.5px}
    .hint .it svg{width:13px;height:13px}
    .hint .sep{height:16px}
    .hud{display:none}
    .tools{left:16px;bottom:14px;gap:7px}
    .btn{font-size:9px;padding:7px 11px}
  }
  /* 窄屏（360 / 375）：5 个按钮并排会贴到右边缘，收紧一档 */
  @media (max-width:379px){
    .tools{left:12px;bottom:16px;gap:5px}
    .btn{padding:7px 8px;font-size:8.5px;letter-spacing:.06em;gap:4px}
    .btn svg{width:10px;height:10px}
    .hint{bottom:66px;gap:11px}
    .hint .it{gap:6px}
    .hint .it .k{font-size:9px;letter-spacing:.06em}
    .hint .it svg{width:11px;height:11px}
    .brand .s{display:none}   /* 320 这种宽度放不下副标题 */
    .brand .t{font-size:14px}
    .veil{padding:22px}
    .veil h1{font-size:15px;letter-spacing:.14em}
    .veil p{font-size:11.5px;line-height:1.85}
    .veil .go{padding:9px 18px;font-size:10.5px}
  }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<div class="ui" id="ui">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff7fa4" stroke-width="1.2" stroke-linecap="round">
        <path d="M12 12c-1.6-2.6-1.5-5.4 0-7.2 1.5 1.8 1.6 4.6 0 7.2Z"/>
        <path d="M12 12c2.6-1.6 5.4-1.5 7.2 0-1.8 1.5-4.6 1.6-7.2 0Z"/>
        <path d="M12 12c1.6 2.6 1.5 5.4 0 7.2-1.5-1.8-1.6-4.6 0-7.2Z"/>
        <path d="M12 12c-2.6 1.6-5.4 1.5-7.2 0 1.8-1.5 4.6-1.6 7.2 0Z"/>
      </svg>
      <span class="t">指尖花</span>
      <span class="s">FINGERTIP BLOOM</span>
    </div>
    <div class="badge"><span class="dot calm" id="bdot"></span><span id="btxt">正在唤醒</span></div>
  </div>

  <div class="hud" id="hud">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/>
        <path d="M11 11.5V5.8a1.5 1.5 0 0 1 3 0V12"/>
        <path d="M14 11.5V7a1.5 1.5 0 0 1 3 0v6"/>
        <path d="M17 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.6a6 6 0 0 1-4.6-2.2L5 15.4a1.6 1.6 0 0 1 2.5-2l1.5 1.7"/>
      </svg>
    </div>
    <div>
      <div class="m" id="hname">等待手势</div>
      <div class="c" id="hconf">置信度 —</div>
    </div>
  </div>

  <div class="cam" id="campanel">
    <canvas id="camcv" width="484" height="324"></canvas>
    <div class="lb"><i></i>HAND TRACKING</div>
  </div>

  <div class="hint" id="hint">
    <div class="it act" id="hFist">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6.5" y="9" width="11" height="9.5" rx="3.4"/>
        <path d="M8.4 9V7.2M11.6 9V6.6M14.8 9V7.2"/>
      </svg>
      <div><div class="k">握拳</div><div class="d">收拢 · 花苞</div></div>
    </div>
    <div class="sep"></div>
    <div class="it" id="hOpen">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 13V9.2M10 12.4V7.4M13 12.4V6.8M16 12.6V8.2"/>
        <path d="M7 13l-1.6 2.4a3 3 0 0 0 1 4.2"/>
        <path d="M16 12.6c.6 1 .6 2.4.6 3.6"/>
        <path d="M7 13c2.6 2 6.4 2 9 0"/>
      </svg>
      <div><div class="k">张开手掌</div><div class="d">控制花瓣 · 自动跟随</div></div>
    </div>
  </div>

  <div class="tools">
    <div class="btn clickable" id="btnMusic">
      <svg viewBox="0 0 24 24" id="icoMusic"><path d="M9 17.5V6.2l10-2v10.6"/><circle cx="6.4" cy="17.6" r="2.6"/><circle cx="16.4" cy="14.9" r="2.6"/></svg>
      <span id="mtext">音乐</span>
      <span class="eq" id="meq" style="display:none"><i></i><i></i><i></i></span>
    </div>
    <div class="btn clickable" id="btnHue">
      <span class="swatch" id="hsw"></span>
      <span>换色</span>
    </div>
    <div class="btn clickable" id="btnShot">
      <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.4-2h7.2L17 8.5h3v10H4Z"/><circle cx="12" cy="13" r="3.2"/></svg>
      保存
    </div>
    <div class="btn clickable" id="btnMouse">

<script>
"use strict";
/* =========================================================
   指尖花 · Fingertip Bloom
   粒子花 + MediaPipe 手部骨骼 → 开合手掌控制绽放
   ========================================================= */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => t * t * (3 - 2 * t);
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------------- 1. 粒子建模 ---------------- */
const L = 1.0;

const P_BUD = [], P_OPEN = [], P_COL = [], P_SIZE = [], P_SEED = [], P_DELAY = [], P_KIND = [];
let CUR_KIND = 0;   // 0=花瓣 1=花心 2=花粉

function addP(bud, open, col, size, delay) {
  P_BUD.push(bud[0], bud[1], bud[2]);
  P_OPEN.push(open[0], open[1], open[2]);
  P_COL.push(col[0], col[1], col[2]);
  P_SIZE.push(size);
  P_SEED.push(Math.random());
  P_DELAY.push(delay);
  P_KIND.push(CUR_KIND);
}

// 花瓣中心线控制点：[水平半径, 高度]
// 扁平花盘：从花心斜上到"肩部"最高，再缓缓下垂，瓣尖外翻微卷 —— 俯视能看全整朵花
const PATH = [
  [0.085,  0.012],
  [0.300,  0.112],
  [0.560,  0.152],
  [0.762,  0.132],
  [0.880,  0.098],
  [0.950,  0.062]
];

function catmullRom(pts, t) {
  const n = pts.length - 1;
  const x = clamp(t, 0, 1) * n;
  const i = Math.min(Math.floor(x), n - 1);
  const f = x - i;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
  const f2 = f * f, f3 = f2 * f;
  const cr = (a, b, c, d) =>
    0.5 * ((2 * b) + (-a + c) * f + (2 * a - 5 * b + 4 * c - d) * f2 + (-a + 3 * b - 3 * c + d) * f3);
  return [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])];
}

// 绽放态：花瓣中心线（碗状上扬，瓣尖外翻）
// lift：整层抬高量，内层抬得高 → 花心隆起、花瓣真正叠压而不是同心环
function petalOpen(t, s, phi, fraySeed, scale, N, tilt, lift) {
  scale = scale || 1;
  const PETALN = N || 7;
  tilt = tilt || 0;
  const c = catmullRom(PATH, t);
  const rr = c[0] * scale * (1 + tilt * Math.pow(t, 1.7));
  const yy = c[1] * scale * (1 + tilt * 0.30 * t);

  // 横向宽度：纺锤形轮廓（瓣根窄 → 中部最宽 → 瓣尖收尖），按当前半径自适应拼满一圈
  const bell = Math.sin(Math.PI * Math.pow(t, 0.68));
  const shape = 0.24 + 0.76 * bell;
  const w = Math.max(0.012, rr * Math.sin(Math.PI / PETALN) * 1.34) * shape;

  // 瓣尖散须：只轻微散开，保持花瓣轮廓清晰
  const fray = t > 0.76 ? (t - 0.76) / 0.24 : 0;
  const wob = 1 + fray * (0.10 + fraySeed * 0.22);
  // 花瓣边缘的波浪起伏，避免死板
  const wav = 1 + Math.sin(t * 6.2 + fraySeed * 6.283) * 0.08;
  const sEff = s * wob * wav;

  // 横向方向 e_phi
  let x = rr * Math.cos(phi) - Math.sin(phi) * sEff * w;
  let z = rr * Math.sin(phi) + Math.cos(phi) * sEff * w;

  // 花瓣内凹 + 高度起伏（让曲面有弧度而不是平面）
  const dent = (1 - s * s) * 0.055 * scale * (0.35 + 0.65 * t);
  x -= Math.cos(phi) * dent;
  z -= Math.sin(phi) * dent;
  // 内层整层抬高：越靠瓣尖抬得越多 → 花心隆起，花瓣层层叠压
  const y = yy + (1 - s * s) * 0.045 * scale * (0.3 + t)
            + (lift || 0) * (0.20 + 0.80 * t) * (1 - s * s * 0.35);

  return [x, y, z];
}

// 收拢态：水滴形花苞 —— 底部圆润、顶部收尖，保留纵向丝缕
function petalBud(t, s, phi, scale) {
  scale = scale || 1;
  const v = clamp(t * 1.02, 0, 1);
  const y = (v - 0.46) * 1.26 * (0.66 + 0.34 * scale);
  // 上尖下圆：峰值偏下，顶部跨度更长
  const k = v < 0.42 ? (v - 0.42) / 0.42 : (v - 0.42) / 0.58;
  const shell = Math.sqrt(Math.max(0, 1 - k * k));
  // 瓣缘微微外凸，形成包裹的棱；再让丝带点螺旋，像花瓣斜着裹上去
  const ridge = 1 + 0.13 * Math.pow(Math.abs(s), 7);
  const rad = 0.268 * shell * scale * ridge;
  const ang = phi + s * 0.38 + v * 0.42;
  const thick = 0.76 + 0.24 * Math.abs(s);
  return [
    Math.cos(ang) * rad * thick,
    y,
    Math.sin(ang) * rad * thick
  ];
}

// 花瓣配色：花心暖橙 → 中段玫红 → 瓣尖亮粉；边缘提亮
function petalColor(t, s, r, phi) {
  let c;
  if (t < 0.30) {
    const k = t / 0.30;
    c = [lerp(1.00, 1.00, k), lerp(0.80, 0.42, k), lerp(0.52, 0.36, k)];
  } else if (t < 0.70) {
    const k = (t - 0.30) / 0.40;
    c = [lerp(1.00, 0.96, k), lerp(0.42, 0.11, k), lerp(0.34, 0.27, k)];
  } else {
    const k = (t - 0.70) / 0.30;
    c = [lerp(0.96, 1.00, k), lerp(0.11, 0.44, k), lerp(0.27, 0.58, k)];
  }
  // 边缘轻微提亮（花瓣轮廓光，不要抢主体）
  const e = Math.pow(Math.abs(s), 2.6);
  c = [lerp(c[0], 1.00, e * 0.40), lerp(c[1], 0.52, e * 0.36), lerp(c[2], 0.62, e * 0.36)];
  // 碗底（t≈0.3）加亮
  const bowl = Math.exp(-Math.pow((t - 0.38) / 0.12, 2)) * Math.pow(Math.abs(s), 4.0) * 0.75;
  c = [c[0] + bowl * 0.34, c[1] + bowl * 0.13, c[2] + bowl * 0.16];
  // 瓣尖亮边
  const tip = Math.pow(clamp((t - 0.80) / 0.20, 0, 1), 1.6) * 0.80;
  c = [c[0] + tip * 0.55, c[1] + tip * 0.22, c[2] + tip * 0.30];
  // 花脉：极淡的放射细纹，只在瓣尖附近隐约可见
  const vein = Math.pow(Math.abs(Math.sin(s * 12.0 + t * 1.1)), 12.0) * 0.12 * t;
  c = [c[0] + vein * 0.34, c[1] + vein * 0.15, c[2] + vein * 0.20];
  // 基部压暗，让碗底不糊成一团
  const baseDim = 0.50 + 0.50 * smoothstep(clamp(t / 0.38, 0, 1));
  // 假光照：左上方来光，朝向光源的花瓣更亮 → 整朵花有立体感
  const lit = 0.85 + 0.15 * Math.cos((phi || 0) - 2.35);
  // 随机明暗
  const f = (0.72 + r * 0.56) * 0.90 * baseDim * lit;
  return [c[0] * f, c[1] * f, c[2] * f];
}

// —— 花瓣粒子（外层 + 中层 + 内层，逐层错开半瓣）
// —— 花瓣粒子（外层 + 中层 + 内层，逐层错开、逐层抬高）
const LAYERS = [
  { count: 9, scale: 1.00, phase: 0.00, bright: 1.18, strands: 58, per: 122, lift: 0.000 },
  { count: 9, scale: 0.72, phase: Math.PI / 9, bright: 1.42, strands: 42, per: 96, lift: 0.055 },
  { count: 7, scale: 0.48, phase: Math.PI / 14, bright: 1.70, strands: 26, per: 70, lift: 0.105 }
];

for (const layer of LAYERS) {
  for (let p = 0; p < layer.count; p++) {
    const phi = (p / layer.count) * Math.PI * 2 + layer.phase;
    const pScale = layer.scale * rnd(0.90, 1.11);
    const pTilt = rnd(-0.12, 0.17);
    for (let st = 0; st < layer.strands; st++) {
      // 丝的位置：边缘更密
      const u = (st / (layer.strands - 1)) * 2 - 1;
      const s0 = Math.sign(u) * Math.pow(Math.abs(u), 0.82) + rnd(-0.03, 0.03);
      const fraySeed = Math.random();
      const sJit = rnd(-0.014, 0.014);
      const n = layer.per;
      for (let i = 0; i < n; i++) {
        const t = 0.10 + Math.pow(i / (n - 1), 0.72) * 0.90 + rnd(-0.007, 0.007);
        const tt = clamp(t, 0, 1);
        const sWave = Math.sin(tt * 3.4 + fraySeed * 6.283) * 0.07;
        const s = clamp(s0 + sJit + sWave, -1.06, 1.06);
        const open = petalOpen(tt, s, phi, fraySeed, pScale, layer.count, pTilt, layer.lift);
        const bud = petalBud(tt, s, phi, pScale);
        const col = petalColor(tt, s, Math.random(), phi);
        // 内部丝略压暗、边缘丝提亮 → 花瓣有"面"也有清晰的轮廓光
        const edgeF = Math.pow(Math.abs(s), 2.2);
        const strandF = (0.88 + 0.62 * edgeF) * layer.bright * 0.85;
        // 边缘粒子略大 → 轮廓清楚又不毛躁
        const size = rnd(1.10, 1.95) * (1.0 + Math.pow(Math.abs(s), 3.0) * 0.55);
        const delay = 0.10 * (1 - tt) + rnd(0, 0.05);
        addP(bud, open, [col[0] * strandF, col[1] * strandF, col[2] * strandF], size, delay);
      }
    }
    // 游离颗粒，增加颗粒质感
    for (let i = 0; i < 52; i++) {
      const t = Math.pow(Math.random(), 0.85);
      const s = rnd(-1, 1) * (0.55 + 0.45 * Math.random());
      const open = petalOpen(t, s, phi + rnd(-0.05, 0.05), Math.random(), pScale, layer.count, pTilt, layer.lift);
      open[0] += rnd(-0.012, 0.012); open[1] += rnd(-0.012, 0.012); open[2] += rnd(-0.012, 0.012);
      const bud = petalBud(t, s, phi, pScale);
      addP(bud, open, petalColor(t, s, Math.random() * 1.2, phi), rnd(0.9, 1.8), rnd(0, 0.16));
    }
  }
}

CUR_KIND = 1;
// —— 花心暖核（大光斑叠加，形成柔和核心而不是死白）
for (let i = 0; i < 560; i++) {
  const u = Math.random() * 2 - 1;
  const th = Math.random() * Math.PI * 2;
  const rr = Math.pow(Math.random(), 0.55) * 0.195;
  const sp = Math.sqrt(Math.max(0, 1 - u * u));
  const x = rr * sp * Math.cos(th);
  const y = rr * u * 0.80 + 0.075;
  const z = rr * sp * Math.sin(th);
  // 越靠中心越白亮
  const k = 1 - Math.min(1, rr / 0.195);
  const col = [
    lerp(1.0, 1.0, k),
    lerp(0.42, 0.88, k),
    lerp(0.14, 0.58, k)
  ];
  const f = (0.70 + Math.random() * 0.44) * 0.19;
  addP(
    [x * 0.50, y * 0.46 - 0.02, z * 0.50],
    [x, y, z],
    [col[0] * f, col[1] * f, col[2] * f],
    rnd(4.5, 10.0),
    rnd(0, 0.10)
  );
}

CUR_KIND = 2;
// —— 飘散花粉
for (let i = 0; i < 1500; i++) {
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(Math.random() * 2 - 1);
  const rr = 0.42 + Math.pow(Math.random(), 0.55) * 1.25;
  const ox = Math.sin(ph) * Math.cos(th) * rr;
  const oy = Math.cos(ph) * rr * 0.85 + 0.05;
  const oz = Math.sin(ph) * Math.sin(th) * rr;
  const col = [1.0, lerp(0.25, 0.62, Math.random()), lerp(0.40, 0.78, Math.random())];
  const f = 0.06 + Math.random() * 0.16;
  addP(
    [ox * 0.24, oy * 0.34 - 0.02, oz * 0.24],
    [ox, oy, oz],
    [col[0] * f, col[1] * f, col[2] * f],
    rnd(0.6, 1.5),
    rnd(0.05, 0.42)
  );
}

CUR_KIND = 3;
// —— 落瓣：从最外层花瓣上脱离、飘落、淡出（真正的下落由顶点着色器驱动）
for (let i = 0; i < 520; i++) {
  const phi = Math.random() * Math.PI * 2;
  const t = rnd(0.50, 0.96);
  const s = rnd(-0.82, 0.82);
  const open = petalOpen(t, s, phi, Math.random(), 1.0, 9, 0, 0);
  const bud = petalBud(t, s, phi, 1.0);
  const col = petalColor(t, s, Math.random(), phi);
  const f = 1.25;
  addP(bud, open, [col[0] * f, col[1] * f, col[2] * f], rnd(1.0, 1.9), rnd(0, 0.12));
}

/* ---------------- 2. WebGL ---------------- */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', {
  antialias: true, alpha: false, premultipliedAlpha: false,
  preserveDrawingBuffer: true,   // 保存图片要用
  powerPreference: 'high-performance'
});

const BG_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const BG_FS = `
precision highp float;
varying vec2 vUv;
uniform vec2 uRes;
uniform float uTime;
uniform float uBloom;
uniform float uHue;

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p, vec2(39.346, 11.135))) * 24634.6345); }

vec3 rgb2hsl(vec3 c){
  float mx = max(max(c.r, c.g), c.b);
  float mn = min(min(c.r, c.g), c.b);
  float l = (mx + mn) * 0.5;
  float d = mx - mn;
  if (d < 0.0001) return vec3(0.0, 0.0, l);
  float s = l > 0.5 ? d / max(2.0 - mx - mn, 0.0001) : d / max(mx + mn, 0.0001);
  float h;
  if (mx == c.r)      h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
  else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
  else                h = (c.r - c.g) / d + 4.0;
  return vec3(h / 6.0, s, l);
}
float h2c(float p, float q, float t){
  t = fract(t);
  if (t < 0.166667) return p + (q - p) * 6.0 * t;
  if (t < 0.5)      return q;
  if (t < 0.666667) return p + (q - p) * (0.666667 - t) * 6.0;
  return p;
}
vec3 hsl2rgb(vec3 hsl){
  if (hsl.y < 0.0001) return vec3(hsl.z);
  float q = hsl.z < 0.5 ? hsl.z * (1.0 + hsl.y) : hsl.z + hsl.y - hsl.z * hsl.y;
  float p = 2.0 * hsl.z - q;
  return vec3(h2c(p, q, hsl.x + 0.333333), h2c(p, q, hsl.x), h2c(p, q, hsl.x - 0.333333));
}
vec3 hueShift(vec3 c, float a){
  float lum = max(max(c.r, c.g), c.b);
  if (lum < 0.0005 || abs(a) < 0.0005) return c;
  vec3 h = rgb2hsl(c / lum);
  h.x = fract(h.x + a);
  return hsl2rgb(h) * lum;
}

void main(){
  vec2 p = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float d = length(p * vec2(0.88, 1.0));

  vec3 inner = vec3(0.015, 0.005, 0.010);
  vec3 outer = vec3(0.002, 0.001, 0.003);
  vec3 col = mix(inner, outer, smoothstep(0.02, 0.90, d));

  // 花心后方的暖光晕，随绽放增强；色相跟随花朵
  float halo = exp(-d * d * 5.2);
  vec3 haloCol = hueShift(vec3(0.082, 0.028, 0.046), uHue);
  col += haloCol * halo * (0.55 + 0.80 * uBloom) * (0.82 + 0.18 * sin(uTime * 0.42));

  // 地平雾带
  col += hueShift(vec3(0.018, 0.006, 0.013), uHue * 0.7) * exp(-pow((p.y + 0.06) * 2.4, 2.0));

  // 星尘：稀疏亮点，缓慢明灭
  vec2 gp = vUv * uRes / 3.0;
  vec2 gi = floor(gp);
  float h = hash(gi);
  if (h > 0.985) {
    vec2 off = vec2(hash2(gi), hash2(gi + 7.1)) - 0.5;
    float dd = length(fract(gp) - 0.5 - off * 0.55);
    float tw = 0.45 + 0.55 * sin(uTime * (0.7 + h * 2.6) + h * 62.0);
    float fade = 1.0 - smoothstep(0.20, 0.88, d);
    col += hueShift(vec3(1.0, 0.58, 0.70), uHue) * smoothstep(0.17, 0.0, dd) * tw * fade * 0.34;
  }

  // 颗粒
  float n = hash(vUv * uRes * 0.7 + fract(uTime) * 13.0);
  col += (n - 0.5) * 0.010;

  gl_FragColor = vec4(col, 1.0);
}`;

const PT_VS = `
precision highp float;
attribute vec3 aBud;
attribute vec3 aOpen;
attribute vec3 aCol;
attribute float aSize;
attribute float aSeed;
attribute float aDelay;
attribute float aKind;

uniform float uBloom;
uniform float uPulse;
uniform float uHue;
uniform float uBeat;
uniform float uBurst;
uniform float uTime;
uniform vec2  uRes;
uniform float uPx;
uniform float uDpr;
uniform float uPxK;
uniform float uYOff;
uniform float uIntro;
uniform vec2  uPar;

varying vec3 vCol;
varying float vA;

/* ---- HSL 色相旋转（先归一化色度，避免暗部变灰） ---- */
vec3 rgb2hsl(vec3 c){
  float mx = max(max(c.r, c.g), c.b);
  float mn = min(min(c.r, c.g), c.b);
  float l = (mx + mn) * 0.5;
  float d = mx - mn;
  if (d < 0.0001) return vec3(0.0, 0.0, l);
  float s = l > 0.5 ? d / max(2.0 - mx - mn, 0.0001) : d / max(mx + mn, 0.0001);
  float h;
  if (mx == c.r)      h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
  else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
  else                h = (c.r - c.g) / d + 4.0;
  return vec3(h / 6.0, s, l);
}

float h2c(float p, float q, float t){
  t = fract(t);
  if (t < 0.166667) return p + (q - p) * 6.0 * t;
  if (t < 0.5)      return q;
  if (t < 0.666667) return p + (q - p) * (0.666667 - t) * 6.0;
  return p;
}

vec3 hsl2rgb(vec3 hsl){
  if (hsl.y < 0.0001) return vec3(hsl.z);
  float q = hsl.z < 0.5 ? hsl.z * (1.0 + hsl.y) : hsl.z + hsl.y - hsl.z * hsl.y;
  float p = 2.0 * hsl.z - q;
  return vec3(h2c(p, q, hsl.x + 0.333333), h2c(p, q, hsl.x), h2c(p, q, hsl.x - 0.333333));
}

vec3 hueShift(vec3 c, float a){
  float lum = max(max(c.r, c.g), c.b);
  if (lum < 0.0005 || abs(a) < 0.0005) return c;
  vec3 h = rgb2hsl(c / lum);           // 归一化色度 → 亮度和色相解耦
  h.x = fract(h.x + a);
  h.y = min(1.0, h.y * 1.30);          // 补一点饱和度，换色后不发灰
  return hsl2rgb(h) * lum;
}

void main(){
  float b = clamp((uBloom - aDelay) / max(1.0 - aDelay, 0.0001), 0.0, 1.0);
  b = b * b * (3.0 - 2.0 * b);

  vec3 p = mix(aBud, aOpen, b);
  // 绽放后整体下移，让花朵保持在画面中心
  p.y -= uYOff * uBloom;

  // 入场：从中心一点萌发，逐粒长出
  float it = clamp((uIntro - aSeed * 0.34) / 0.66, 0.0, 1.0);
  it = 1.0 - pow(1.0 - it, 3.0);
  p *= it;

  // 呼吸
  float br = 1.0 + 0.016 * sin(uTime * 0.80 + aSeed * 0.4);
  p *= br;

  // 微风：整朵花轻轻摇曳，瓣尖摆幅更大
  float lift = clamp(p.y + 0.35, 0.0, 1.6);
  p.x += (sin(uTime * 0.44) * 0.020 + sin(uTime * 0.29 + 1.7) * 0.013) * lift;
  p.z += (cos(uTime * 0.37 + 0.8) * 0.017 + sin(uTime * 0.23) * 0.010) * lift;
  p.y += sin(uTime * 0.31 + 2.4) * 0.010 * lift;

  // 微粒浮动
  float ph = aSeed * 6.2831;
  float amp = 0.005 + 0.011 * b;
  p.x += sin(uTime * 1.25 + ph) * amp;
  p.y += cos(uTime * 1.05 + ph * 1.7) * amp;
  p.z += sin(uTime * 0.95 + ph * 2.3) * amp;

  // 花心：缓慢搏动 + 跟着鼓点跳
  if (aKind > 0.5 && aKind < 1.5) {
    p *= 1.0 + 0.055 * sin(uTime * 1.55 + aSeed * 6.2831) + uBeat * 0.085;
  }

  // 花粉：向上飘散，带缓慢横向游移；绽放瞬间向外迸发
  if (aKind > 1.5 && aKind < 2.5) {
    float t2 = uTime * 0.42 + aSeed * 21.0;
    p.x += sin(t2) * 0.06;
    p.y += cos(t2 * 0.83) * 0.085 + sin(uTime * 0.23 + aSeed * 6.2831) * 0.055;
    p.z += sin(t2 * 0.67) * 0.06;
    p *= 1.0 + uBurst * (0.30 + aSeed * 0.45);
  }

  // 落瓣：从花瓣上慢慢脱离、飘落、淡出
  float fallFade = 1.0;
  if (aKind > 2.5) {
    float f = fract(uTime * 0.052 + aSeed * 3.71);
    f = f * f;
    p.y -= f * 1.55;
    p.x += sin(uTime * 0.78 + aSeed * 21.0) * f * 0.26;
    p.z += cos(uTime * 0.61 + aSeed * 17.0) * f * 0.20;
    fallFade = (1.0 - f) * smoothstep(0.42, 0.92, uBloom);
  }

  // 音乐：整朵花随低频轻轻胀缩
  p *= 1.0 + uBeat * 0.028;

  // 开合变化时的脉冲
  p *= 1.0 + uPulse * 0.06;

  // 俯视花盘：约 38° 俯角，花盘正对屏幕，层次清楚不散
  float ang = -0.66;
  float ca = cos(ang), sa = sin(ang);
  vec3 q = vec3(p.x, p.y * ca - p.z * sa, p.y * sa + p.z * ca);

  // 视差：近处跟随更多，制造空间纵深
  float dep = 0.5 + clamp(q.z, -1.2, 1.2) * 0.42;
  q.x += uPar.x * (0.03 + dep * 0.075);
  q.y += uPar.y * (0.03 + dep * 0.075);

  float persp = 1.0 / (1.0 + q.z * 0.28);
  vec2 ndc = vec2(q.x * persp * uPx, q.y * persp * uPx) / (0.5 * uRes);

  gl_Position = vec4(ndc, 0.0, 1.0);

  // 景深：远处更小更淡，近处更大更实
  float dof = smoothstep(-1.25, 0.85, q.z);
  gl_PointSize = aSize * uDpr * uPxK * persp * (0.62 + 0.62 * dof);

  // 花心保持暖色（只轻微跟随），花瓣与花粉完整换色
  float hueAmt = (aKind > 0.5 && aKind < 1.5) ? uHue * 0.22 : uHue;
  vCol = hueShift(aCol, hueAmt) * (0.56 + 0.44 * uBloom) * (1.0 + uBeat * 0.20 + uBurst * 0.55);
  vA = clamp(0.30 + 0.78 * dof, 0.10, 1.0) * smoothstep(0.0, 0.55, it) * fallFade;
}`;

const PT_FS = `
precision highp float;
varying vec3 vCol;
varying float vA;
void main(){
  vec2 d = gl_PointCoord - 0.5;
  float r = length(d) * 2.0;
  if (r > 1.0) discard;
  float a = 1.0 - r;
  // 核心亮、边缘柔的软光斑
  float core = a * a;
  float soft = core * core * (0.62 + 0.38 * core);
  gl_FragColor = vec4(vCol * (soft + core * 0.55) * vA, 1.0);
}`;

/* ---------- 后处理：亮部提取 / 高斯模糊 / 合成 ---------- */
const POST_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

const BRIGHT_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uTexel;
uniform float uThreshold;
void main(){
  vec3 c  = texture2D(uTex, vUv + uTexel * vec2(-0.5, -0.5)).rgb;
  c += texture2D(uTex, vUv + uTexel * vec2( 0.5, -0.5)).rgb;
  c += texture2D(uTex, vUv + uTexel * vec2(-0.5,  0.5)).rgb;
  c += texture2D(uTex, vUv + uTexel * vec2( 0.5,  0.5)).rgb;
  c *= 0.25;
  float lum = dot(c, vec3(0.2126, 0.7152, 0.0722));
  float k = smoothstep(uThreshold, uThreshold + 0.42, lum);
  gl_FragColor = vec4(c * k, 1.0);
}`;

const BLUR_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uDir;
void main(){
  vec3 s = texture2D(uTex, vUv).rgb * 0.2270270;
  s += (texture2D(uTex, vUv + uDir * 1.0).rgb + texture2D(uTex, vUv - uDir * 1.0).rgb) * 0.1945946;
  s += (texture2D(uTex, vUv + uDir * 2.0).rgb + texture2D(uTex, vUv - uDir * 2.0).rgb) * 0.1216216;
  s += (texture2D(uTex, vUv + uDir * 3.0).rgb + texture2D(uTex, vUv - uDir * 3.0).rgb) * 0.0540541;
  s += (texture2D(uTex, vUv + uDir * 4.0).rgb + texture2D(uTex, vUv - uDir * 4.0).rgb) * 0.0162162;
  gl_FragColor = vec4(s, 1.0);
}`;

const COMP_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uScene;
uniform sampler2D uGlow;
uniform vec2 uRes;
uniform float uTime;
uniform float uGlowAmt;
uniform float uIntro;
uniform float uBeat;
uniform float uBurst;

vec3 aces(vec3 x){
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

void main(){
  vec2 uv = vUv;
  vec2 cc = uv - 0.5;
  float r2 = dot(cc, cc);

  // 镜头色差：中心几乎无，边缘轻微分离
  float ca = 0.0012 + r2 * 0.0055;

  vec3 col;
  col.r = texture2D(uScene, uv + cc * ca).r;
  col.g = texture2D(uScene, uv).g;
  col.b = texture2D(uScene, uv - cc * ca).b;

  vec3 glow;
  glow.r = texture2D(uGlow, uv + cc * ca * 2.0).r;
  glow.g = texture2D(uGlow, uv).g;
  glow.b = texture2D(uGlow, uv - cc * ca * 2.0).b;

  col += glow * uGlowAmt * (1.0 + uBeat * 0.50 + uBurst * 1.10);

  // 暗角
  float vig = smoothstep(1.02, 0.22, length(cc * vec2(1.0, 0.94)) * 1.30);
  col *= 0.52 + 0.48 * vig;

  // 色调映射，保留高光层次不糊成白块
  col = aces(col * 3.00);

  // 绽放瞬间：从花心向外扩散的一圈光环（只叠加，不动整体曝光）
  if (uBurst > 0.002) {
    float rad = length(cc * vec2(1.0, 1.06));
    float ring = exp(-pow((rad - (1.0 - uBurst) * 0.62) / 0.072, 2.0));
    col += vec3(1.0, 0.70, 0.80) * ring * uBurst * 0.50;
  }

  // 胶片颗粒
  float n = hash(uv * uRes + fract(uTime * 0.63) * 97.0);
  col += (n - 0.5) * 0.018;

  // 入场淡入
  col *= smoothstep(0.0, 0.30, uIntro);

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s), src);
  }
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}

const bgProg = program(BG_VS, BG_FS);
const ptProg = program(PT_VS, PT_FS);
const brightProg = program(POST_VS, BRIGHT_FS);

/* ---------- 离屏帧缓冲 ---------- */
function createFBO(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}
function freeFBO(f) {
  if (!f) return;
  gl.deleteFramebuffer(f.fb);
  gl.deleteTexture(f.tex);
}

let fboScene = null, fboGlowA = null, fboGlowB = null;
function rebuildFBO() {
  freeFBO(fboScene); freeFBO(fboGlowA); freeFBO(fboGlowB);
  fboScene = createFBO(W, H);
  const gw = Math.max(4, Math.floor(W / 4));
  const gh = Math.max(4, Math.floor(H / 4));
  fboGlowA = createFBO(gw, gh);
  fboGlowB = createFBO(gw, gh);
}

function drawQuad(posLoc) {
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function makeBuf(data, loc) {
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  return b;
}
// 打乱粒子顺序：低帧时只画前 N% 就是均匀抽样，不会缺掉整片花瓣
(function shuffleParticles() {
  const n = P_SIZE.length;
  const idx = new Uint32Array(n);
  for (let i = 0; i < n; i++) idx[i] = i;
  for (let i = n - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
  }
  const reorder = (arr, w) => {
    const copy = arr.slice();
    for (let i = 0; i < n; i++) {
      const s = idx[i] * w;
      for (let k = 0; k < w; k++) arr[i * w + k] = copy[s + k];
    }
  };
  reorder(P_BUD, 3); reorder(P_OPEN, 3); reorder(P_COL, 3);
  reorder(P_SIZE, 1); reorder(P_SEED, 1); reorder(P_DELAY, 1); reorder(P_KIND, 1);
})();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, DPRCAP);
  W = Math.floor(window.innerWidth * DPR);
  H = Math.floor(window.innerHeight * DPR);
  canvas.width = W; canvas.height = H;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  rebuildFBO();
}

const GESTURE_NAME = ['指尖收拢', '半开 · 舒展', '手掌张开'];

function updateUI() {
  const g = state.bloom;
  const gi = g < 0.28 ? 0 : g < 0.66 ? 1 : 2;
  state.gesture = gi;

  btxt.textContent = gi === 0 ? '指尖收拢 · 花苞'
    : gi === 1 ? '半开 · 舒展中'
    : (state.mouseMode && IS_TOUCH ? '手指上滑 · 绽放' : '手掌张开 · 绽放');
  bdot.className = 'dot' + (gi === 0 ? ' calm' : '');

  if (state.mouseMode) {
    // 手机上没有"指针"，说手指更自然
    hname.textContent = IS_TOUCH
      ? (gi === 0 ? '手指收拢' : gi === 1 ? '半开 · 舒展' : '完全绽放')
      : (gi === 0 ? '指针收拢' : gi === 1 ? '指针半开' : '指针舒展');
    hconf.textContent = '开合 ' + Math.round(g * 100) + '%';
  } else if (state.handActive) {
    hname.textContent = GESTURE_NAME[gi];
    hconf.textContent = '置信度 ' + Math.round(state.handConf * 100) + '%';
  } else {
    hname.textContent = '等待手势';
    hconf.textContent = '把手放进镜头';
  }

  hFist.classList.toggle('act', gi === 0);
  hOpen.classList.toggle('act', gi === 2);
}

function pointerToBloom(y) {
  // 上方 = 绽放，下方 = 收拢
  const t = 1 - clamp(y / window.innerHeight, 0, 1);
  return clamp((t - 0.12) / 0.76, 0, 1);
}

// 指针落在界面控件上时不要影响花朵（否则点左下角按钮，花会收起来）
const UI_SEL = '.tools, .hint, .cam, .hud, .veil, .shot';
function overUI(e) {
  const t = e.target;
  return !!(t && t.closest && t.closest(UI_SEL));

/* ---------- 背景音乐 ---------- */
const bgm = document.getElementById('bgm');
const btnMusic = document.getElementById('btnMusic');
const meq = document.getElementById('meq');
const mtext = document.getElementById('mtext');

const MUSIC_VOL = 0.52;
let musicWanted = true;      // 用户是否希望有音乐（点暂停后为 false）
let musicStarted = false;

/* ---- 音频分析：让花朵跟着音乐呼吸 ---- */
// ⚠️ createMediaElementSource 一旦接管音频，声音就只能从 AudioContext 出来。
// 所以必须先确认 context 能 running 再接管，否则会彻底没声音。
let actx = null, analyser = null, freqData = null, gainNode = null;
let audioReady = false, audioTries = 0;

async function ensureAudioGraph() {
  if (audioReady) return true;
  if (audioTries >= 4) return false;   // 允许重试：第一次可能没有用户手势
  audioTries++;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { audioTries = 99; return false; }

    const c = new AC();
    if (c.state === 'suspended') await c.resume();
    if (c.state !== 'running') {
      // 拿不到 running 就绝不接管音频，让 <audio> 自己出声
      try { c.close(); } catch (e) {}
      return false;
    }

    actx = c;
    const src = c.createMediaElementSource(bgm);
    const an = c.createAnalyser();
    an.fftSize = 512;
    an.smoothingTimeConstant = 0.70;
    gainNode = c.createGain();
    gainNode.gain.value = bgm.volume;      // 接管后改用 GainNode 控音量
    src.connect(an);
    an.connect(gainNode);
    gainNode.connect(c.destination);

    analyser = an;
    freqData = new Uint8Array(an.frequencyBinCount);
    audioReady = true;
    return true;
  } catch (e) {
    console.warn('音频分析不可用，音乐走普通播放', e);
    audioReady = false;
    return false;
  }
}

// 统一音量入口：接管后用 GainNode，没接管就用 element 的 volume
function setVolume(v) {
  const x = clamp(v, 0, 1);
  if (gainNode) gainNode.gain.value = x;
  bgm.volume = x;
}
function getVolume() {
  return gainNode ? gainNode.gain.value : bgm.volume;
}

// 低频能量 0..1：用「慢速基线」提取鼓点 —— 持续的低音被吸收，只有突然变强才算一拍
let bassBase = 0, bassPrevT = 0;
function readBass() {
  if (!audioReady || !analyser || bgm.paused) return 0;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let i = 1; i <= 6; i++) sum += freqData[i];   // 约 40–520Hz
  const raw = sum / (6 * 255);

  const now = performance.now();
  const dtR = bassPrevT ? Math.min(0.25, (now - bassPrevT) / 1000) : 0.016;
  bassPrevT = now;

  if (bassBase === 0) bassBase = raw;                // 首帧直接对齐，避免开机就爆
  bassBase += (raw - bassBase) * Math.min(1, dtR * 0.85);   // 时间常数约 1.2 秒
  return clamp((raw - bassBase) * 5.5, 0, 1);
}

function syncMusicBtn() {
  const on = !bgm.paused && !bgm.ended;
  btnMusic.classList.toggle('playing', on);
  meq.style.display = on ? 'inline-flex' : 'none';
  mtext.style.display = on ? 'none' : 'inline';
  mtext.textContent = musicStarted ? '播放' : '音乐';
}

function fadeTo(target, ms) {
  const from = getVolume();
  const t0 = performance.now();
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    setVolume(from + (target - from) * (k * k * (3 - 2 * k)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// 尝试播放：先让 <audio> 出声，再异步建立音频图（失败也不影响出声）
function tryPlayMusic() {
  if (!musicWanted || !bgm.paused) return;

  setVolume(0);
  const p = bgm.play();

  const onPlayed = () => {
    musicStarted = true;
    btnMusic.classList.remove('needtap');
    fadeTo(MUSIC_VOL, 2200);
    syncMusicBtn();
  };

  const onBlocked = () => {
    syncMusicBtn();
    // 浏览器拦了自动播放：闪一下音乐按钮，提示点它
    btnMusic.classList.add('needtap');
    setTimeout(() => btnMusic.classList.remove('needtap'), 9000);
  };

  if (p && p.then) p.then(onPlayed).catch(onBlocked);
  else onPlayed();

  // 不 await：不能因为音频图建立失败而影响正常播放
  ensureAudioGraph();
}

btnMusic.addEventListener('click', () => {
  if (bgm.paused) {
    musicWanted = true;
    tryPlayMusic();
  } else {
    musicWanted = false;
    fadeTo(0, 380);
    setTimeout(() => { if (!musicWanted) bgm.pause(); }, 400);
    setTimeout(syncMusicBtn, 60);
  }
});

// 自动播放被拦截时，任意一次点击/触摸都补上
function unlockMusic() {
  if (musicWanted && bgm.paused) tryPlayMusic();
  else if (!audioReady) ensureAudioGraph();   // 已经在播但还没接上分析 → 借这次手势补
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev =>
  window.addEventListener(ev, unlockMusic, { passive: true })
);

const btnShot = document.getElementById('btnShot');

// 触屏设备（手机 / 平板）—— 这类设备上 <a download> 基本不可用
// 定义放在靠前的位置：文案、保存、全屏按钮都要用它判断
btnShot.addEventListener('click', () => {

  qualityLock = true;
  if (DPRCAP < 2) { DPRCAP = 2; shotBoostDpr = true; resize(); }
  if (drawCount < COUNT) { shotBoostDraw = drawCount; drawCount = COUNT; }
  // 等下一帧渲染完成再取，保证拿到的是完整画面
  shotPending = true;
  btnShot.classList.add('on');
});

function openShotLayer(url, name) {
  if (shotURL && shotURL !== url) { /* data URL 无需释放 */ }
  shotURL = url; shotName = name;
  shotImg.src = url;
  // 桌面端也能长按保存，但按钮更顺手；手机上 iOS 完全没有下载按钮，只提示长按
  shotDl.style.display = IS_IOS ? 'none' : '';

    ? '长按图片 · 选择「<b>保存到相册</b>」'
    : '已生成图片 · 可下载或直接右键另存';
  shotLayer.classList.add('on');
}

function closeShotLayer() {
  shotLayer.classList.remove('on');
  // 动画结束后再清，避免闪一下空图
  setTimeout(() => { if (!shotLayer.classList.contains('on')) shotImg.removeAttribute('src'); }, 340);
}

shotClose.addEventListener('click', closeShotLayer);
shotLayer.addEventListener('click', (e) => { if (e.target === shotLayer) closeShotLayer(); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && shotLayer.classList.contains('on')) closeShotLayer();
});

shotDl.addEventListener('click', () => {
  if (!shotURL) return;
  const a = document.createElement('a');
  a.href = shotURL;
  a.download = shotName;
  document.body.appendChild(a);
  a.click();
  a.remove();
});

function takeShot() {
  shotPending = false;
  btnShot.classList.remove('on');
  // 导出尺寸兜底：iOS / 微信对超大 base64 图片会渲染失败甚至崩溃，
  // 最长边压到 2048（手机 canvas 本来就不到这个尺寸，等于不缩）
  const MAXEDGE = 2048;
  let src = canvas;
  const big = Math.max(canvas.width, canvas.height);
  if (big > MAXEDGE) {
    const k = MAXEDGE / big;
    const tmp = document.createElement('canvas');
    tmp.width = Math.round(canvas.width * k);
    tmp.height = Math.round(canvas.height * k);
    const tc = tmp.getContext('2d');
    tc.imageSmoothingEnabled = true;
    tc.imageSmoothingQuality = 'high';
    tc.drawImage(canvas, 0, 0, tmp.width, tmp.height);
    src = tmp;
  }

  let url;
  try {
    // 手机端走 JPEG：这张图全是高频粒子 + 胶片颗粒，PNG 压不动，
    // 780×1688 的 PNG 转 base64 有 4MB —— iOS 的 <img> 处理这么大的 data URL
    // 会直接渲染失败，长按也存不下来。JPEG 0.94 只要几百 KB，肉眼几乎无差。
    url = IS_TOUCH
      ? src.toDataURL('image/jpeg', 0.94)
      : src.toDataURL('image/png');
  } catch (e) {
    console.warn('截图失败', e);
    restoreQuality();
    return;
  }

  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const name = 'fingertip-bloom-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
             + '-' + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds())
             + (IS_TOUCH ? '.jpg' : '.png');

  if (IS_TOUCH) {
    // 手机：铺出大图让用户长按存相册（iOS / 安卓 / 微信内都通用）
    openShotLayer(url, name);
  } else {
    // 桌面：直接下载，保持原来的手感
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // 图已经取到手，把画质降回去省性能。延迟一下等预览层盖上来，
  // 否则用户会看到画面先糊一帧。
  restoreQuality();
}

// 把截图时临时提上去的分辨率 / 粒子数还原
function restoreQuality() {
  if (!shotBoostDpr && !shotBoostDraw) { qualityLock = false; return; }
  const backDpr = shotBoostDpr, backDraw = shotBoostDraw;
  shotBoostDpr = false; shotBoostDraw = 0;
  setTimeout(() => {
    if (backDraw) drawCount = backDraw;
    if (backDpr && DPRCAP > 1) { DPRCAP = 1; resize(); }
    qualityLock = false;
  }, 320);
}

// 载入手部识别模型（只做一次，失败可重试）
function loadModel() {
  if (landmarker) return Promise.resolve(true);
  if (modelPromise) return modelPromise;
  modelPromise = (async () => {
    let HandLandmarker, FilesetResolver;
    try {
      const mod = await import('./vendor/vision_bundle.mjs');
      HandLandmarker = mod.HandLandmarker;
      FilesetResolver = mod.FilesetResolver;
    } catch (err) {
      console.warn('MediaPipe 加载失败', err);
      modelPromise = null;
      return false;
    }
    const build = async (delegate) => {
      const fileset = await FilesetResolver.forVisionTasks('./vendor/wasm');
      return HandLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: './vendor/hand_landmarker.task', delegate: delegate },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
    };
    try {
      landmarker = await build('GPU');
    } catch (err) {
      console.warn('GPU 初始化失败，回退 CPU', err);
      try {
        landmarker = await build('CPU');
      } catch (e2) {
        console.warn('CPU 初始化失败', e2);
        modelPromise = null;
        return false;
      }
    }
    window.__handReady = true;
    return true;
  })();
  return modelPromise;
}

async function startCamera() {
  const ok = await loadModel();
  if (!ok) {
    enterMouseFallback(
      '手部识别模型没能加载。\n' +
      '可以先用鼠标／手指滑动控制花朵。',
      { retry: true, title: '模型加载失败' }
    );
    return;
  }

  vmsg.textContent = '请求摄像头权限…';
  vspin.style.display = 'block';
  vgo.style.display = 'none';

  // 非安全上下文（http + 局域网 IP）下浏览器根本不提供摄像头 API
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    enterMouseFallback(
      '浏览器只在 HTTPS 或 localhost 下提供摄像头。\n\n' +
      (IS_TOUCH
        ? '手机上用手指上下滑动，也能控制花朵开合。'
        : '电脑本机用 start.bat 打开就有摄像头；\n当前地址不是 localhost，先用鼠标上下移动控制花朵。'),
      { title: '此环境不支持摄像头', btn: IS_TOUCH ? '用手指滑动看效果' : '用鼠标看效果' }
    );
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
  } catch (err) {
    console.warn('摄像头失败', err);
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    enterMouseFallback(
      denied
        ? '浏览器拒绝了摄像头权限。\n\n' +
          '点地址栏左侧的小图标 → 允许摄像头，\n' +
          '再点下面重试。'
        : '没有找到可用的摄像头。\n' +
          '可以先用鼠标／手指滑动控制花朵。',
      { retry: true, title: '摄像头未开启' }
    );
    return;
  }

  video.srcObject = stream;
  await video.play().catch(() => {});

  veil.classList.add('gone');
  campanel.classList.add('on');
  hud.classList.add('on');
  state.mouseMode = false;
  state.camFailed = false;
  state.ready = true;
  btnMouse.classList.remove('on');
  btnMouse.lastChild.textContent = '鼠标模式';
  btnMouse.style.display = '';   // 手势模式恢复了，允许切回去
  tryPlayMusic();
  startDetect();
}

let detectStarted = false;
function startDetect() {
  if (detectStarted) return;
  detectStarted = true;
  let lastVideoTime = -1;
  let lastDetect = 0;
  const dbg = { calls: 0, hits: 0, err: '', skipped: 0 };
  window.__dbgDetect = dbg;

  function detect(now) {
    requestAnimationFrame(detect);
    if (!state.ready) return;
    if (state.mouseMode) return;
    if (video.readyState < 2) return;
    if (now - lastDetect < 28) return;   // 约 35fps
    lastDetect = now;

    if (video.currentTime === lastVideoTime) { dbg.skipped++; return; }
    lastVideoTime = video.currentTime;

    let res;
    try {
      res = landmarker.detectForVideo(video, now);
      dbg.calls++;
    } catch (e) { dbg.err = String(e && e.message || e); return; }

    drawCam(res);

    if (res && res.landmarks && res.landmarks.length > 0) {
      dbg.hits++;
      const lm = res.landmarks[0];
      const open = handOpenness(lm);
      state.target = open;
      state.handActive = true;
      state.lastHandAt = now;
      // 手的位置用于视差
      state.handX = lm[9].x;
      state.handY = lm[9].y;
      const hs = res.handednesses || res.handedness;
      if (hs && hs[0] && hs[0][0]) state.handConf = hs[0][0].score;
      else state.handConf = 0.7 + open * 0.25;
    } else {
      // 丢失手：缓慢回到半收
      if (now - state.lastHandAt > 500) {
        state.handActive = false;
        state.target = 0.10;
        state.handConf *= 0.9;
      }
    }
  }
  requestAnimationFrame(detect);
}

async function boot() {
  ui.classList.add('on');
  vmsg.textContent = '载入手部识别模型…';

  // file:// 下浏览器禁用摄像头，且无法加载 ESM 模块
  if (location.protocol === 'file:') {
    enterMouseFallback(
      '浏览器不允许 file:// 页面调用摄像头，\n' +
      '这是 Chrome / Edge 的硬性限制，改代码绕不过去。\n\n' +
      '解决办法（10 秒）：\n' +
      '1. 关掉本页\n' +
      '2. 双击同文件夹里的「启动花朵.vbs」\n' +
      '3. 新页面会自动打开并询问摄像头权限\n\n' +
      '没有 .vbs 就双击 start.bat，效果一样。',
      { title: '双击「启动花朵.vbs」即可', btn: '先用鼠标看效果' }
    );
    return;
  }

  await startCamera();
}

// 开合度：指尖到腕点距离均值 / 掌长（实测：完全张开≈1.62，握拳≈0.95）
function handOpenness(lm) {
  const w = lm[0], mcp = lm[9];
  const palm = Math.hypot(w.x - mcp.x, w.y - mcp.y) || 0.001;
  const tips = [4, 8, 12, 16, 20];
  let sum = 0;
  for (const i of tips) {
    sum += Math.hypot(lm[i].x - w.x, lm[i].y - w.y);
  }
  const avg = sum / tips.length / palm;
  return clamp((avg - 1.02) / (1.58 - 1.02), 0, 1);
}

// 画摄像头预览（灰度 + 粉色骨骼）
function drawCam(res) {
  const w = camcv.width, h = camcv.height;
  camctx.save();
  camctx.clearRect(0, 0, w, h);

  // 镜像 + 灰度
  camctx.translate(w, 0);
  camctx.scale(-1, 1);
  camctx.filter = 'grayscale(1) contrast(1.06) brightness(.92)';
  try { camctx.drawImage(video, 0, 0, w, h); } catch (e) {}
  camctx.filter = 'none';
  camctx.restore();

  // 压暗边缘
  const vg = camctx.createRadialGradient(w / 2, h / 2, h * 0.15, w / 2, h / 2, h * 0.85);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,4,9,.62)');
  camctx.fillStyle = vg;
  camctx.fillRect(0, 0, w, h);

  if (!res || !res.landmarks || !res.landmarks.length) return;

  const lm = res.landmarks[0];
  const px = (i) => [(1 - lm[i].x) * w, lm[i].y * h];

  camctx.lineWidth = 1.6;
  camctx.strokeStyle = 'rgba(255,120,155,.92)';
  camctx.shadowColor = 'rgba(255,90,140,.9)';
  camctx.shadowBlur = 7;
  camctx.beginPath();
  for (const [a, b] of HAND_CONN) {
    const [ax, ay] = px(a), [bx, by] = px(b);
    camctx.moveTo(ax, ay);
    camctx.lineTo(bx, by);
  }
  camctx.stroke();

  camctx.shadowBlur = 5;
  camctx.fillStyle = 'rgba(255,205,220,.95)';
  for (let i = 0; i < lm.length; i++) {
    const [x, y] = px(i);
    camctx.beginPath();
    camctx.arc(x, y, i % 4 === 0 ? 2.2 : 1.5, 0, Math.PI * 2);
    camctx.fill();
  }
  camctx.shadowBlur = 0;
}

/* ---------------- 5. 渲染循环 ---------------- */
let t0 = performance.now();
let lastT = t0;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const time = (now - t0) / 1000;

  // 目标值
  let tgt;
  if (state.mouseMode) {
    tgt = 0.06 + state.pointer * 0.94;
  } else {
    tgt = state.handActive ? state.target : 0.10;
  }
  // 平滑跟随
  const k = 1 - Math.pow(0.001, dt);   // 帧率无关平滑
  state.bloom += (tgt - state.bloom) * Math.min(1, k * 0.85);
  state.bloom = clamp(state.bloom, 0, 1);

  // UI 节流
  if (now - (frame._ui || 0) > 90) {
    frame._ui = now;
    updateUI();
  }

  // 入场生长
  if (state.ready) state.intro = Math.min(1, state.intro + dt * 0.62);

  // 自适应画质：连续低帧就先降渲染分辨率，还不行就抽稀粒子
  if (state.ready && !qualityLock) {
    frame._pa = (frame._pa || 0) + dt;
    frame._pn = (frame._pn || 0) + 1;
    if (frame._pn >= 100) {
      const avg = frame._pa / frame._pn;
      if (avg > 0.036 && DPRCAP > 1) {          // 低于约 28fps
        DPRCAP = 1;
        resize();
      } else if (avg > 0.042 && drawCount > COUNT * 0.55) {
        drawCount = Math.floor(COUNT * 0.62);   // 还是卡就抽稀
      }
      frame._pa = 0; frame._pn = 0;
    }
  }

  // 开合变化 → 脉冲（花朵会随手势轻轻震颤）
  const dBloom = Math.abs(state.bloom - state.prevBloom);
  state.prevBloom = state.bloom;
  if (dBloom > 0.003) state.pulse = Math.min(1, state.pulse + dBloom * 3.4);
  state.pulse *= Math.pow(0.015, dt);

  // 自动换色：每 9.5 秒平滑过渡到下一个色相（只走 蓝紫→粉→蜜桃，避开绿色）
  state.hueTimer += dt;
  if (state.hueTimer > 9.5) {
    state.hueTimer = 0;
    state.hueIdx = (state.hueIdx + 1) % HUE_SEQ.length;
    state.hueTarget = HUE_SEQ[state.hueIdx];
    updateSwatch();
  }
  state.hue += (state.hueTarget - state.hue) * Math.min(1, dt * 1.8);

  // 音乐驱动：低频能量（鼓点 / 贝斯）平滑后驱动花朵呼吸
  const bass = readBass();
  state.beat += (bass - state.beat) * Math.min(1, dt * 14);

  // 绽放瞬间：bloom 越过 0.88 时闪一次
  if (state.bloom > 0.88 && state.prevBloomForBurst <= 0.88) state.burst = 1;
  state.prevBloomForBurst = state.bloom;
  state.burst *= Math.pow(0.015, dt);

  // 视差目标：鼠标位置 / 手的位置
  let ptx = 0, pty = 0;
  if (state.mouseMode) {
    ptx = (state.mouseX / window.innerWidth - 0.5) * 2;
    pty = -(state.mouseY / window.innerHeight - 0.5) * 2;
  } else if (state.handActive) {
    ptx = (0.5 - state.handX) * 2;
    pty = (state.handY - 0.5) * 2;
  }
  state.parTarget.x = clamp(ptx, -1, 1) * 1.1;
  state.parTarget.y = clamp(pty, -1, 1) * 1.1;
  const pk = Math.min(1, dt * 3.4);
  state.par.x += (state.parTarget.x - state.par.x) * pk;
  state.par.y += (state.parTarget.y - state.par.y) * pk;

  const portrait = H > W * 1.12;
  // 横屏手机屏幕矮，用桌面那套系数花朵会小得可怜，单独放大一档
  const landscapePhone = window.innerHeight < 560 && window.innerWidth > window.innerHeight;
  const pxPerUnit = Math.min(W, H) * (portrait ? 0.375 : landscapePhone ? 0.36 : 0.30);

  /* ---------- Pass 1：场景 → 离屏 ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboScene.fb);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);

  gl.useProgram(bgProg);
  gl.uniform2f(bgResLoc, W, H);
  gl.uniform1f(bgTimeLoc, time);
  gl.uniform1f(bgBloomLoc, state.bloom);
  gl.uniform1f(bgHueLoc, state.hue);
  drawQuad(bgPosLoc);

  // 粒子（加法混合）
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(ptProg);

  const bind = (buf, location, size) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
  };
  bind(bufBud, loc.bud, 3);
  bind(bufOpen, loc.open, 3);
  bind(bufCol, loc.col, 3);
  bind(bufSize, loc.size, 1);
  bind(bufSeed, loc.seed, 1);
  bind(bufDelay, loc.delay, 1);
  bind(bufKind, loc.kind, 1);

  gl.uniform1f(loc.bloom, state.bloom);
  gl.uniform1f(loc.pulse, state.pulse);
  gl.uniform1f(loc.hue, state.hue);
  gl.uniform1f(loc.beat, state.beat);
  gl.uniform1f(loc.burst, state.burst);
  gl.uniform1f(loc.time, time);
  gl.uniform2f(loc.res, W, H);
  gl.uniform1f(loc.px, pxPerUnit);
  gl.uniform1f(loc.dpr, DPR);
  // 小屏上粒子相对花瓣更大、重叠更多 → 按 CSS 像素密度收一点，避免糊成一团
  gl.uniform1f(loc.pxk, clamp(pxPerUnit / (DPR * 200), 0.72, 1.12));
  gl.uniform1f(loc.yoff, portrait ? 0.34 : 0.20);
  gl.uniform1f(loc.intro, state.intro);
  gl.uniform2f(loc.par, state.par.x, state.par.y);

  gl.drawArrays(gl.POINTS, 0, drawCount);

  /* ---------- Pass 2：亮部提取 → 1/4 分辨率 ---------- */
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fboGlowA.fb);
  gl.viewport(0, 0, fboGlowA.w, fboGlowA.h);
  gl.useProgram(brightProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
  gl.uniform1i(postLoc.bright.tex, 0);
  gl.uniform2f(postLoc.bright.texel, 1 / W, 1 / H);
  gl.uniform1f(postLoc.bright.thr, 0.62);
  drawQuad(postLoc.bright.pos);

  /* ---------- Pass 3：分离式高斯模糊（两轮） ---------- */
  gl.useProgram(blurProg);
  gl.uniform1i(postLoc.blur.tex, 0);
  for (let i = 0; i < 2; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fboGlowB.fb);
    gl.viewport(0, 0, fboGlowB.w, fboGlowB.h);
    gl.bindTexture(gl.TEXTURE_2D, fboGlowA.tex);
    gl.uniform2f(postLoc.blur.dir, 1.1 / fboGlowA.w, 0);
    drawQuad(postLoc.blur.pos);

    gl.bindFramebuffer(gl.FRAMEBUFFER, fboGlowA.fb);
    gl.viewport(0, 0, fboGlowA.w, fboGlowA.h);
    gl.bindTexture(gl.TEXTURE_2D, fboGlowB.tex);
    gl.uniform2f(postLoc.blur.dir, 0, 1.1 / fboGlowB.h);
    drawQuad(postLoc.blur.pos);
  }

  /* ---------- Pass 4：合成到屏幕 ---------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(compProg);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, fboScene.tex);
  gl.uniform1i(postLoc.comp.scene, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, fboGlowA.tex);
  gl.uniform1i(postLoc.comp.glow, 1);

  gl.uniform2f(postLoc.comp.res, W, H);
  gl.uniform1f(postLoc.comp.time, time);
  gl.uniform1f(postLoc.comp.amt, 0.62);
  gl.uniform1f(postLoc.comp.intro, state.intro);
  gl.uniform1f(postLoc.comp.beat, state.beat);
  gl.uniform1f(postLoc.comp.burst, state.burst);
  drawQuad(postLoc.comp.pos);
  gl.activeTexture(gl.TEXTURE0);

  if (shotPending) takeShot();
}

requestAnimationFrame(frame);

// 调试入口（供预览/截图用）
window.__debug = {
  state,
  setOpen(v) { state.mouseMode = true; state.pointer = clamp(v, 0, 1); },
  setHue(v) { state.hue = v; state.hueTarget = v; state.hueTimer = 0; },
  audio() {
    return {
      ctx: actx ? actx.state : 'none',
      ready: audioReady,
      tries: audioTries,
      paused: bgm.paused,
      t: +bgm.currentTime.toFixed(2),
      vol: +bgm.volume.toFixed(2),
      gain: gainNode ? +gainNode.gain.value.toFixed(2) : null,
      beat: +state.beat.toFixed(3)
    };
  }
};

/* ---------------- 6. 启动 ---------------- */
window.addEventListener('load', () => {
  boot().catch((e) => {
    console.error(e);
    enterMouseFallback('初始化异常，已切换到鼠标模式。');
  });
});
</script>
</body>
